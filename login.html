<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход | Hercules</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar__inner">
    <a class="brand" href="main.php">
      <span class="brand__mark">H</span>
      <span class="brand__name">Hercules</span>
    </a>
    <nav class="nav">
      <a href="main.php">Главная</a>
      <a href="schedule.php">Расписание</a>
       <button type="button" class="theme-btn" id="themeToggle" aria-label="Toggle theme">
  Тема
</button>
    </nav>
  </div>
</header>

<main class="page">
  <div class="container">
    <section class="card login-card">
      <h1>Вход</h1>
      <p class="muted">Выберите роль и введите данные</p>

      <!-- ROLE SELECT -->
      <div class="role-select">
        <label class="role">
          <input type="radio" name="role" value="student" checked>
          <span>Студент</span>
        </label>
        <label class="role">
          <input type="radio" name="role" value="teacher">
          <span>Учитель</span>
        </label>
      </div>

      <!-- LOGIN FORM -->
      <form action="login.php" method="post" novalidate>
        <label>
          Email
          <input type="email" placeholder="Email" name="email" required>
        </label>

        <label>
          Пароль
          <input type="password" placeholder="••••••••" name="password" required>
        </label>

        <button type="submit" class="btn btn--primary btn--full">
          Войти
        </button>
      </form>

      <a class="back" href="main.php">← Вернуться на главную</a>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="container">Hercules © 2026</div>
</footer>

<script>
  document.querySelectorAll('input[name="role"]').forEach(radio => {
    radio.addEventListener('change', function () {
      if (this.value === 'teacher') {
        window.location.href = 'teacherlogin.html';
      }
    });
  });

(function(){
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if (saved === "dark") root.setAttribute("data-theme","dark");

  const btn = document.getElementById("themeToggle");
  if (!btn) return;

  btn.addEventListener("click", () => {
    const isDark = root.getAttribute("data-theme") === "dark";
    if (isDark) {
      root.removeAttribute("data-theme");
      localStorage.setItem("theme","light");
    } else {
      root.setAttribute("data-theme","dark");
      localStorage.setItem("theme","dark");
    }
  });
})();
</script>
</body>
</html>
